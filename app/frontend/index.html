<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collaborative Pixel Canvas — r/place</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!-- Canvas display -->
    <canvas id="viewport-canvas"></canvas>

    <!-- Top floating HUD -->
    <header class="hud-top">
      <div class="hud-title">
        <span class="hud-logo">🎨</span>
        <strong>Pixel Canvas</strong>
        <span class="badge" id="canvas-size">10,000 × 10,000</span>
      </div>
      <div class="hud-info">
        <span id="coord-display">X: — , Y: —</span>
        <span class="separator">|</span>
        <span id="zoom-display">100%</span>
        <span class="separator">|</span>
        <span class="badge badge-live" id="stream-status">⚡ 0 tuiles</span>
        <span class="separator">|</span>
        <span class="badge badge-tokens" id="tokens-display" title="Pixels disponibles (Rate Limit)">🪙 20/20</span>
      </div>
      <div class="hud-auth">
        <button id="btn-discord-login" class="btn-discord">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
          </svg>
          <span>Connexion Discord</span>
        </button>
        <div id="user-display" class="user-display hidden">
          <span class="user-avatar-badge">👾</span>
          <span id="user-name"></span>
          <button id="btn-logout" class="btn-logout" title="Déconnexion">✕</button>
        </div>
      </div>
    </header>

    <!-- Left Toolbar -->
    <aside class="hud-toolbar" id="toolbar">
      <div class="tool-section">
        <label class="section-label">Outil</label>
        <div class="tool-group">
          <button id="tool-draw" class="btn-tool active" title="Mode Dessin">✏️ Dessin</button>
          <button id="tool-pan" class="btn-tool" title="Mode Déplacement (ou maintenir Espace)">✋ Pan</button>
        </div>
      </div>

      <div class="tool-section">
        <label class="section-label">Taille du pinceau</label>
        <div class="brush-selector" id="brush-selector">
          <button class="btn-brush active" data-size="1">1px</button>
          <button class="btn-brush" data-size="3">3px</button>
          <button class="btn-brush" data-size="5">5px</button>
          <button class="btn-brush" data-size="9">9px</button>
        </div>
      </div>

      <div class="tool-section">
        <label class="section-label">Palette de couleurs</label>
        <div class="palette-grid" id="palette-grid">
          <!-- Populated by main.ts with 16 standard colors -->
        </div>
        <div class="custom-color-row">
          <input type="color" id="custom-color" value="#ff0000" />
          <span id="color-hex-label">#ff0000</span>
        </div>
      </div>

      <div class="tool-section">
        <button id="btn-reset-view" class="btn-action">Centrer la vue</button>
      </div>
    </aside>

    <!-- Bottom-right Inspector Panel -->
    <section class="hud-inspector" id="inspector">
      <div class="inspector-header">Informations du Pixel</div>
      <div class="inspector-body">
        <div class="info-row">
          <span class="info-label">Position :</span>
          <span class="info-value" id="inspect-coords">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">Auteur :</span>
          <span class="info-value" id="inspect-author">Vide</span>
        </div>
        <div class="info-row">
          <span class="info-label">Date :</span>
          <span class="info-value" id="inspect-time">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">Couleur :</span>
          <span class="info-value" id="inspect-color">—</span>
        </div>
      </div>
    </section>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
