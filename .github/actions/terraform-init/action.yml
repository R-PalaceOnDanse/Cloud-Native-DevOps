name: terraform-init
description: Install Terraform, authenticate to Google Cloud without a key, and run terraform init for one stack and one environment.

inputs:
  stack:
    description: Folder name under infra/, for example foundation or access.
    required: true
  environment:
    description: dev or prd. Selects backends/<environment>.hcl.
    required: true
  workload-identity-provider:
    description: Full name of the workload identity provider of the environment's project.
    required: true
  service-account:
    description: Email of the service account to impersonate (the plan account or the apply account).
    required: true
  terraform-version:
    description: Exact Terraform version. Keep it equal to mise.lock.
    required: false
    default: "1.9.8"

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false
    - uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ inputs.service-account }}
    - name: terraform init
      shell: bash
      working-directory: infra/${{ inputs.stack }}
      run: terraform init -input=false -backend-config=backends/${{ inputs.environment }}.hcl
