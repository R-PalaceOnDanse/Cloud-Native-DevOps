name: frontend-deploy

# Builds app/frontend with the configuration of one environment and releases it to the default Firebase Hosting site
# of that environment (#168). Called by the release after the serverless stack is applied; not meant to be started by
# hand.
on:
  workflow_call:
    inputs:
      environment:
        description: dev or prd. Also the name of the GitHub environment the job runs in.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: deploy frontend to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # Only a job of this environment may impersonate the apply account (ADR-0011), which holds roles/firebase.admin.
    environment: ${{ inputs.environment }}
    env:
      # Exact version, so a release cannot change because firebase-tools published a new one.
      FIREBASE_TOOLS_VERSION: "15.36.0"
    steps:
      - uses: actions/checkout@v4
      # Authenticates and initialises the serverless stack only to read its outputs: nothing is planned or applied.
      # The auth step writes a credentials file and exports GOOGLE_APPLICATION_CREDENTIALS, which firebase-tools
      # reads as Application Default Credentials: no key and no FIREBASE_TOKEN.
      - uses: ./.github/actions/terraform-init
        with:
          stack: serverless
          environment: ${{ inputs.environment }}
          workload-identity-provider: ${{ inputs.environment == 'dev' && vars.GCP_WIF_PROVIDER_DEV || vars.GCP_WIF_PROVIDER_PRD }}
          service-account: ${{ inputs.environment == 'dev' && vars.GCP_APPLY_SA_DEV || vars.GCP_APPLY_SA_PRD }}
      - name: Write the build configuration from the Terraform outputs
        id: config
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infra/serverless output -json frontend_build_env > "$RUNNER_TEMP/frontend_build_env.json"
          # Public values only (see outputs.tf): Vite inlines them into the bundle anyway.
          jq -r 'to_entries[] | "\(.key)=\(.value)"' "$RUNNER_TEMP/frontend_build_env.json" > app/frontend/.env.production
          project_id="$(jq -r '.VITE_FIREBASE_PROJECT_ID' "$RUNNER_TEMP/frontend_build_env.json")"
          if [ -z "$project_id" ] || [ "$project_id" = "null" ]; then
            echo "::error::frontend_build_env has no VITE_FIREBASE_PROJECT_ID. Is the serverless stack applied?"
            exit 1
          fi
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"
          echo "Building for $project_id with: $(cut -d= -f1 app/frontend/.env.production | paste -sd' ')"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: npm ci
        shell: bash
        working-directory: app/frontend
        run: npm ci
      - name: npm run build
        shell: bash
        working-directory: app/frontend
        run: npm run build
      - name: Deploy to Firebase Hosting
        shell: bash
        working-directory: app/frontend
        env:
          PROJECT_ID: ${{ steps.config.outputs.project_id }}
        run: |
          npx --yes "firebase-tools@$FIREBASE_TOOLS_VERSION" deploy --only hosting --project "$PROJECT_ID" \
            --non-interactive --message "$GITHUB_REF_NAME ($GITHUB_SHA)"
      - name: Show the site in the job summary
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PROJECT_ID: ${{ steps.config.outputs.project_id }}
        run: |
          echo "### frontend $GITHUB_REF_NAME deployed to $ENVIRONMENT: https://$PROJECT_ID.web.app" >> "$GITHUB_STEP_SUMMARY"
