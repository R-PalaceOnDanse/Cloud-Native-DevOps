# From the subject, C03 sections 6 to 8, unchanged except for the Terraform version marked below.
# .github/workflows/terraform-ci.yml
name: Terraform CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  id-token: write # required for OIDC
jobs:
  validate-plan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prd]
    environment: ${{ matrix.env }}
    defaults:
      run:
        working-directory: infra/foundation
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        # The only change to the subject's example: the stack requires Terraform 1.9.x
        # (required_version), and the action installs the latest version when none is given.
        with:
          terraform_version: 1.9.8
      # Authenticate with OIDC (GCP example; swap for AWS as needed)
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - run: terraform fmt -check
      - run: terraform init -backend-config=backends/${{ matrix.env }}.hcl
      - run: terraform validate
      - run: terraform plan -var-file=${{ matrix.env }}.tfvars
