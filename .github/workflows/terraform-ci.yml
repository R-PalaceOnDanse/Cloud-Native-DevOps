name: terraform-ci

# Checks every change to the infrastructure, and shows what it would change in dev and in prd.
# It only reads: it authenticates as the read-only plan account, in no GitHub environment.
on:
  pull_request:
    paths:
      - 'infra/**'
      - 'app/functions/**'
      - '.tflint.hcl'
      - '.github/actions/terraform-init/**'
      - '.github/workflows/terraform-ci.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [foundation, access, serverless]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: terraform fmt
        run: terraform -chdir=infra/${{ matrix.stack }} fmt -check -diff
      - name: terraform validate
        run: |
          terraform -chdir=infra/${{ matrix.stack }} init -backend=false -input=false
          terraform -chdir=infra/${{ matrix.stack }} validate
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0
      - name: tflint
        run: tflint --chdir=infra/${{ matrix.stack }} --config="$GITHUB_WORKSPACE/.tflint.hcl"

  plan:
    name: plan (${{ matrix.stack }}, ${{ matrix.environment }})
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [foundation, access, serverless]
        environment: [dev, prd]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/terraform-init
        with:
          stack: ${{ matrix.stack }}
          environment: ${{ matrix.environment }}
          workload-identity-provider: ${{ matrix.environment == 'dev' && vars.GCP_WIF_PROVIDER_DEV || vars.GCP_WIF_PROVIDER_PRD }}
          service-account: ${{ matrix.environment == 'dev' && vars.GCP_PLAN_SA_DEV || vars.GCP_PLAN_SA_PRD }}
      - name: terraform plan
        shell: bash
        working-directory: infra/${{ matrix.stack }}
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        # -lock=false: a plan only reads, so two pull requests can plan at the same time.
        run: terraform plan -input=false -lock=false -no-color -var-file="$ENVIRONMENT.tfvars" 2>&1 | tee plan.txt
      - name: Show the plan in the job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Plan: ${{ matrix.stack }} in ${{ matrix.environment }}"
            echo '```'
            cat infra/${{ matrix.stack }}/plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
