name: functions-ci

# Compiles every function in strict TypeScript on pull requests, so a type error never reaches a
# release. The deployment itself is done by terraform-deploy (serverless stack).
on:
  pull_request:
    paths:
      - 'app/functions/**'
      - '.github/workflows/functions-ci.yml'

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.function }})
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        function: [hello]
    defaults:
      run:
        working-directory: app/functions/${{ matrix.function }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/functions/${{ matrix.function }}/package-lock.json
      - run: npm ci
      - run: npm run build
