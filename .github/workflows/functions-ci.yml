name: functions-ci

# Builds, lints and tests the serverless functions whenever they change.
on:
  pull_request:
    paths:
      - 'app/functions/**'
      - '.github/workflows/functions-ci.yml'
  push:
    branches: [main]
    paths:
      - 'app/functions/**'
      - '.github/workflows/functions-ci.yml'

defaults:
  run:
    working-directory: app/functions

jobs:
  functions-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/functions/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
