#.github/workflows/terraform-destroy.yml
name: Terraform Destroy
on:
    workflow_dispatch:
        inputs:
            env:
                description: "Environment to destroy (dev or prd)"
                required: true
                default: dev
permissions:
    contents: read
    id-token: write
jobs:
    destroy:
        runs-on: ubuntu-latest
        environment: ${{ github.event.inputs.env }}
        defaults:
            run:
                working-directory: infra/foundation
        steps:
            - uses: actions/checkout@v4
            - uses: hashicorp/setup-terraform@v3
            - uses: google-github-actions/auth@v2
              with:
                workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                service_account: ${{ vars.GCP_SERVICE_ACCOUNT_DEPLOY }}
            - run: terraform init -backend-config=backends/${{ github.event.inputs.env }}.hcl
            - run: terraform destroy -auto-approve -var-files=${{ github.event.inputs.env }}