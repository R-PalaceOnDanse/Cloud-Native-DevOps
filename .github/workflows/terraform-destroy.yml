# From the subject, C03 sections 6 to 8, unchanged except for the Terraform version marked below.
# .github/workflows/terraform-destroy.yml
name: Terraform Destroy
on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to destroy (dev or prd)"
        required: true
        default: dev
permissions:
  contents: read
  id-token: write
jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.env }}
    defaults:
      run:
        working-directory: infra/foundation
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        # The only change to the subject's example: the stack requires Terraform 1.9.x
        # (required_version), and the action installs the latest version when none is given.
        with:
          terraform_version: 1.9.8
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - run: terraform init -backend-config=backends/${{ github.event.inputs.env }}.hcl
      - run: terraform destroy -auto-approve -var-file=${{ github.event.inputs.env }}.tfvars
