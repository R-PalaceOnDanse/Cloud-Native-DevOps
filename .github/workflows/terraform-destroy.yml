name: terraform-destroy

# Destroys the serverless stack, then the foundation, of one environment, on demand. The access stack is never destroyed here:
# it holds the identity this workflow runs with.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy
        required: true
        type: choice
        options:
          - dev
          - prd
      confirm:
        description: Type the name of the environment again to confirm
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-deploy
  cancel-in-progress: false

jobs:
  guard:
    name: confirmation and branch
    runs-on: ubuntu-latest
    steps:
      - name: Refuse anything but main with the environment name repeated
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Destroy is run from main only (this run is on $GITHUB_REF)."
            exit 1
          fi
          if [ "$CONFIRM" != "$ENVIRONMENT" ]; then
            echo "::error::The confirmation must be exactly '$ENVIRONMENT'."
            exit 1
          fi

  destroy-serverless:
    needs: guard
    uses: ./.github/workflows/terraform-run.yml
    with:
      stack: serverless
      environment: ${{ inputs.environment }}
      action: destroy

  destroy-foundation:
    needs: destroy-serverless
    uses: ./.github/workflows/terraform-run.yml
    with:
      stack: foundation
      environment: ${{ inputs.environment }}
      action: destroy
