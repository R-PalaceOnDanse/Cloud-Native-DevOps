name: terraform-run

# Plans, then applies the saved plan, for the foundation of one environment. Called by the release
# and by the destroy workflows; it is not meant to be started by hand.
on:
  workflow_call:
    inputs:
      environment:
        description: dev or prd. Also the name of the GitHub environment the job runs in.
        required: true
        type: string
      action:
        description: apply or destroy.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  run:
    name: ${{ inputs.action }} foundation in ${{ inputs.environment }}
    runs-on: ubuntu-latest
    # Only a job of this environment may impersonate the apply account (ADR-0011).
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/terraform-init
        with:
          stack: foundation
          environment: ${{ inputs.environment }}
          workload-identity-provider: ${{ inputs.environment == 'dev' && vars.GCP_WIF_PROVIDER_DEV || vars.GCP_WIF_PROVIDER_PRD }}
          service-account: ${{ inputs.environment == 'dev' && vars.GCP_APPLY_SA_DEV || vars.GCP_APPLY_SA_PRD }}
      - name: terraform plan
        shell: bash
        working-directory: infra/foundation
        env:
          ACTION: ${{ inputs.action }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          flags=""
          if [ "$ACTION" = "destroy" ]; then flags="-destroy"; fi
          terraform plan $flags -input=false -no-color -var-file="$ENVIRONMENT.tfvars" -out=tfplan 2>&1 | tee plan.txt
      - name: Show the plan in the job summary
        if: always()
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          {
            echo "### $ACTION: foundation in $ENVIRONMENT"
            echo '```'
            cat infra/foundation/plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: terraform apply the saved plan
        shell: bash
        working-directory: infra/foundation
        run: terraform apply -input=false -no-color tfplan
