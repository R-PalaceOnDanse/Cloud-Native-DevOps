# From the subject, C03 sections 6 to 8, unchanged except for the Terraform version marked below.
# .github/workflows/terraform-deploy.yml
name: Terraform Deploy
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1 # dev must succeed before prd
      matrix:
        env: [dev, prd]
    environment: ${{ matrix.env }} # add required reviewers on prd
    defaults:
      run:
        working-directory: infra/foundation
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        # The only change to the subject's example: the stack requires Terraform 1.9.x
        # (required_version), and the action installs the latest version when none is given.
        with:
          terraform_version: 1.9.8
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - run: terraform init -backend-config=backends/${{ matrix.env }}.hcl
      - run: terraform apply -auto-approve -var-file=${{ matrix.env }}.tfvars
