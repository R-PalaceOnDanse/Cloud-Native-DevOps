name: terraform-deploy

# A release: pushing a tag vMAJOR.MINOR.PATCH applies foundation then serverless to dev, then to prd.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  id-token: write

# One release at a time, and a running apply is never cancelled.
concurrency:
  group: terraform-deploy
  cancel-in-progress: false

jobs:
  check-tag:
    name: the tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse a tag whose commit is not on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main. Releases are made from main only."
            exit 1
          fi

  foundation-dev:
    needs: check-tag
    uses: ./.github/workflows/terraform-run.yml
    secrets: inherit
    with:
      stack: foundation
      environment: dev
      action: apply

  serverless-dev:
    needs: foundation-dev
    uses: ./.github/workflows/terraform-run.yml
    secrets: inherit
    with:
      stack: serverless
      environment: dev
      action: apply

  foundation-prd:
    needs: serverless-dev
    uses: ./.github/workflows/terraform-run.yml
    with:
      stack: foundation
      environment: prd
      action: apply

  serverless-prd:
    needs: foundation-prd
    uses: ./.github/workflows/terraform-run.yml
    with:
      stack: serverless
      environment: prd
      action: apply
