# Grafana on the system pool (ADR-0021). No disk: the dashboards are files of the repository and the
# datasource is provisioned by Terraform. No public address: reach it with kubectl port-forward.
replicas: 1

service:
  type: ClusterIP

persistence:
  enabled: false

# The admin login and password come from the grafana-admin secret, copied from Secret Manager.
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

serviceAccount:
  create: true
  name: grafana

nodeSelector:
  role: system

resources:
  requests:
    cpu: 100m
    memory: 200Mi
  limits:
    memory: 400Mi
