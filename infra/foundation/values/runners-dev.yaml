# The name is the label a job puts in `runs-on`. Both environments serve the same repository, so
# each one has its own name.
runnerScaleSetName: arc-dev
maxRunners: 2

template:
  spec:
    nodeSelector:
      role: runner
    tolerations:
      - key: "runner"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: 500m