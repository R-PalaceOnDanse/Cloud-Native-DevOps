# maxRunners and minRunners are set by helm-arc.tf from <env>.tfvars, where Terraform validates
# them (docs/infra.md#cost-safeguards). Do not set them here.

template:
  spec:
    nodeSelector:
      role: runner
    tolerations:
      - key: "runner"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: 500m
