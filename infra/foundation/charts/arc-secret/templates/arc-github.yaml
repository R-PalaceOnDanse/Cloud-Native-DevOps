apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp
spec:
  provider:
    gcpsm:
      projectID: {{ required "projectId is required" .Values.projectId | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gcp
  target:
    name: arc-github
    creationPolicy: Owner
  data:
{{- if eq .Values.authType "app" }}
    - secretKey: github_app_id
      remoteRef:
        key: {{ .Values.appIdSecretName | default "arc-github-app-id" | quote }}
    - secretKey: github_app_installation_id
      remoteRef:
        key: {{ .Values.appInstallationIdSecretName | default "arc-github-app-installation-id" | quote }}
    - secretKey: github_app_private_key
      remoteRef:
        key: {{ .Values.appPrivateKeySecretName | default "arc-github-app-private-key" | quote }}
{{- else }}
    - secretKey: github_token
      remoteRef:
        key: {{ required "secretName is required" .Values.secretName | quote }}
{{- end }}
